{% extends "base.html" %}
{% load static %}
{% load wagtailcore_tags %}

{% block content %}
    <div class="flex min-h-fit justify-start my-5 mx-5">
        <div class="grid place-items-center items-center w-2/3">
            <div class="grid gap-y-5 text-white">
                <h1 class="text-4xl">Hello, I'm Altug Karakurt</h1>
                <p>{{ page.home_text }}</p>
                {{ page.body|richtext }}
            </div>
        </div>
        <div class="grid place-items-center justify-end w-1/3 px-5 py-5">
            <img class="rounded-full" src="{% static 'altugsite/images/altug.jpg' %}">
        </div>
    </div>
{% endblock content %}
