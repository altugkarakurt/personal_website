{% extends "base.html" %}
{% load static %}
{% load wagtailcore_tags %}

{% block content %}
    <div class="grid lg:flex place-items-center min-h-fit m-5">
        <div class="grid place-items-center px-5 py-5 max-w-sm lg:w-1/3 lg:justify-start">
            <img class="rounded-full" src="{% static 'altugsite/images/altug.jpg' %}">
        </div>
        <div class="grid place-items-center items-center w-full lg:w-2/3 justify-center lg:justify-end">
            <div class="grid gap-y-5 text-white text-justify w-full mx-auto">
                <h1 class="text-4xl text-center">Hello, I'm Altug Karakurt</h1>
                <article class="prose lg:prose-lg text-white w-full">
                    <p>{{ page.home_text }}</p>
                </article>
                <article class="prose lg:prose-lg text-white w-full">
                    {{ page.body|richtext }}
                </article>
            </div>
        </div>
    </div>
{% endblock content %}
