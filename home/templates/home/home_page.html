{% extends "base.html" %}
{% load static %}
{% load wagtailcore_tags %}

{% block content %}
    <div class="grid md:flex place-items-center min-h-fit my-10 mx-10 gap-x-10 gap-y-10">
        <div class="grid place-items-center px-5 py-5 max-w-md md:w-1/3 md:justify-start">
            <img class="rounded-full" src="{% static 'altugsite/images/altug.jpg' %}">
        </div>
        <div class="grid place-items-center items-center w-full md:w-2/3 justify-center md:justify-end">
            <div class="grid gap-y-5 text-white text-justify">
                <h1 class="text-4xl text-center">Hello, I'm Altug Karakurt</h1>
                <p>{{ page.home_text }}</p>
                {{ page.body|richtext }}
            </div>
        </div>
    </div>
{% endblock content %}
