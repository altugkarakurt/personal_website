{% extends "blog/blog_base.html" %}
{% block blog-content %}
    <h2>{{ title }}</h2>
    {{ description }}
    <hr>
    {% for post in posts %}
        <div>
            <h3><a href="{% url 'blog-post-view' post.id %}">{{ post.title }}</a></h3>
            <small class="text-muted">{{ post.date_posted|date:"F d, Y" }}</small>
            <p>{{ post.content }}</p>
        </div>
        <hr>
    {% endfor %}
{% endblock blog-content %}
