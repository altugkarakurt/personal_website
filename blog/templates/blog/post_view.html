{% extends "blog/blog_base.html" %}
{% block blog-content %}
  <h2>{{ title }}</h2>
  <p class="text-muted">{{ post.date_posted|date:"F d, Y" }}</p>
  <hr>
  <p>{{ content }}</p>
  <div class="d-flex flex-row">
      {% for tag in tags %}
        <div class="m-1 px-2 py-1 bg-secondary rounded"><a href="{% url 'blog-tag-view' tag.title %}">{{ tag.title }}</a></div>
      {% endfor %}
  </div>
{% endblock blog-content %}
