{% extends "blog/blog_base.html" %}

{% load blog_filters %}

{% block blog-content %}
    {% for post in post_list %}
        <div>
            <h3><a href="{% url 'blog-post-view' post.url %}">{{ post.title }}</a></h3>
            <small class="text-muted">{{ post.date_posted|date:"F d, Y" }}</small>
            <p class="article-content">{{ post.blurb | render_markdown | safe }}</p>
        </div>
        <hr>
    {% endfor %}
{% endblock blog-content %}
