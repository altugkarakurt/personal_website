{% extends "blog/base.html" %}
{% block content %}
    <div class="container d-flex row g-3">
      <div class="col-md-8 p-3">
        {% block blog-content %}{% endblock %}
      </div>
      <div class="col-md-4 order-md-last p-3">
        <div class="row">
          <h3>Tags</h3>
          <div class="d-flex flex-row p-2">
            {% for tag in blog_base_tags %}
              <div class="m-1 px-2 py-1 bg-secondary rounded"><a href="{% url 'tag-view' tag.title %}">{{ tag.title }}</a></div>
            {% endfor %}
          </div>
        </div>
        <br>
        <div class="row gx-2 gy-2">
          <h3>Series</h3>
            <ul class="list-group">
              {% for s in blog_base_series %}
                <li class="list-group-item bg-secondary list-group-item-light"><a href="{% url 'series-view' s.title %}">{{ s.title }}</a></li>
              {% endfor %}
            </ul>
        </div>
      </div>
    </div>
{% endblock content %}
